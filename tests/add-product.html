<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>إضافة منتج</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="form-container">
    <h1>إضافة منتج جديد</h1>
    <form th:action="@{/products/add}" th:object="${product}" method="post">
        <label>اسم المنتج:</label>
        <input type="text" th:field="*{name}" required="required" />

        <label>السعر:</label>
        <input type="number" step="0.01" th:field="*{price}" required="required" />

        <label>التفاصيل:</label>
        <textarea th:field="*{details}"></textarea>

        <label>رابط الصورة:</label>
        <input type="text" th:field="*{image}" />

        <button type="submit" class="btn">حفظ المنتج</button>
    </form>
    <a th:href="@{/products}" class="back-link">العودة للقائمة</a>
</div>
</body>
</html>
